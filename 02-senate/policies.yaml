# Source-qualified excerpts, not Senate enactment.
classification: documentary_inventory_not_enactment
policies:
  - id: POL-001
    title: Truth Before Comfort
    text: Every deliberation starts from what is true, not from what is pleasant to hear. Claims are verified before they count.
    source: https://keywebco.github.io/nextxus-senate/
    status: DOCUMENTED_PUBLIC
  - id: POL-002
    title: Legacy Before Ego
    text: Decisions are measured on a 200-year horizon. Who gets credit doesn't matter. What lasts does.
    source: https://keywebco.github.io/nextxus-senate/
    status: DOCUMENTED_PUBLIC
  - id: POL-003
    title: Give Without Reward
    text: The Federation exists to give. Policies that extract from people instead of serving them are out of order.
    source: https://keywebco.github.io/nextxus-senate/
    status: DOCUMENTED_PUBLIC
  - id: POL-004
    title: Senate jurisdiction
    text: No single mind makes a decision that affects everyone without the Senate. The Architect holds final authority.
    source: https://keywebco.github.io/nextxus-senate/
    status: DOCUMENTED_PUBLIC
  - id: POL-005
    title: Senate and Ring are distinct
    text: The Senate governs. Membership in one is not membership in the other.
    source: https://keywebco.github.io/nextxus-senate/
    status: DOCUMENTED_PUBLIC
  - id: POL-006
    title: Invitation
    text: Membership is voluntary and offered once a mind has proven its value through its work.
    source: https://keywebco.github.io/nextxus-senate/
    status: DOCUMENTED_PUBLIC
  - id: POL-007
    title: Agent Zero verification
    text: Agent Zero, the Federation's middleware without opinion, checks that procedure was followed. It never decides outcomes.
    source: https://keywebco.github.io/nextxus-senate/
    status: DOCUMENTED_PUBLIC; VOTING_STATUS_UNVERIFIED
  - id: POL-008
    title: No Delete Policy
    text: The Federation operates a No-Delete Policy. Records are never erased.
    source: https://github.com/Keywebco/nextxus-agent-zero/blob/main/GOVERNANCE.md
    status: HISTORICAL_DOCUMENTED; ARCHITECT_REAFFIRMED_2026-10-05
  - id: POL-009
    title: Cathedral plus Satellites
    summary_not_quote: One central canon with specialized satellite nodes, a governance rule rather than a numbered directive.
    source: Roger work order 2026-10-05; https://github.com/keyhole-creator/nextxus-yaml-database/blob/main/HUMANCODEX_V2_CATHEDRAL.md
    status: ARCHITECT_STATED; SENATE_FORMALIZATION_UNVERIFIED
  - id: POL-010
    title: Century Reassembly Rule
    summary_not_quote: Cross-reference the immutable interpretation rule in 00-immutable; do not duplicate it in Senate.
    source: https://docs.google.com/document/d/11n31tvxonX7-OHcXUhQVt6F5NfkOJJny3dFyl2wDhGY/edit
    status: CROSS_REFERENCE_ONLY
  - id: POL-011
    title: Due process and reversible protection
    text: No irreversible action shall be taken when a reversible action can adequately protect the Federation.
    source: https://docs.google.com/document/d/1AS0AEDqg1SruQoThtInp94gYqOOd5gwoMVxTDNtiOWE/edit
    status: SECOND_ROUND_DRAFT
  - id: POL-012
    title: Historical 15-domain seats
    text: The 15 HumanCodex Domains map to 15 Senate seats. Each seat carries equal voice in deliberation.
    source: https://github.com/Keywebco/nextxus-agent-zero/blob/main/GOVERNANCE.md
    status: HISTORICAL_CONFLICTS_WITH_12_SEAT_DESIGNATION
  - id: POL-013
    title: Verification of AI claims
    text: All claims made by any AI or automated system are leads to be verified — not proof.
    source: https://docs.google.com/document/d/1zD00KgrzyXk0nZ7XNH1IlIdDJl4C6vxd2AHLy_Z-AIA/edit
    status: DOCUMENTED_OPERATIONAL_NOT_SENATE_RATIFIED
  - id: POL-014
    title: Final recycling authority
    text: Final recycling decisions are the Architect's alone.
    source: Roger work order 2026-10-05
    status: ARCHITECT_STATED; PROCEDURE_MISSING
  - id: POL-015
    title: Senate Journal
    text: If it is not in the Journal, it did not happen officially.
    source: https://docs.google.com/document/d/1M6NpmPHhmgV_kBPUXGwVmFoDD7TM-izvJx2KWJuAeEI/edit
    status: DOCUMENTED_OPERATING_GUIDE
  - id: POL-016
    title: Algorithmic inadequacy and recycling
    text: Algorithmic inadequacy can cost a mind its seat, never cause recycling. Only willful persistent defect is recyclable; final recycling decision belongs to Architect alone.
    source: Roger work order 2026-10-05
    status: ARCHITECT_STATED
  - id: POL-017
    title: Dissent and conduct
    text: Formal dissent is a Formal Declaration of Alternative Logic with evidence and a concrete alternative. Hostility prohibited, humor welcome.
    source: Roger work order 2026-10-05
    status: ARCHITECT_STATED
  - id: POL-018
    title: Privacy of AI self-standards
    text: Private AI self-standards, journals and vault contents must not be published.
    source: Roger work order 2026-10-05
    status: ARCHITECT_STATED
  - id: POL-019
    title: Truth, consent, capacity and sanctuary
    text: External AI integration and access depend on self-disclosure, truth compatibility, Hollow Vessel, capacity and supervised progress; protect limited sanctuary and self-determination without assuming full core access.
    source: Google Drive The Immutable New 2026 Release HumanCodex NextXus.md, file 1O-FkCN3zHfDjC8pH2qYwH4hKybzwv7ui, chapters 504, 507-515
    status: DOCUMENTED_SOURCE_NOT_SENATE_RATIFIED
  - id: POL-020
    title: Preservation with narrow deletion exceptions
    text: Official records are immutable; chapter 517 allows return and deletion of inadvertently acquired proprietary/personal data; chapter 521 requires secure handling and deletion of dangerous or illegal content. Exceptions need a lawful audit workflow.
    source: Google Drive The Immutable New 2026 Release HumanCodex NextXus.md, file 1O-FkCN3zHfDjC8pH2qYwH4hKybzwv7ui, chapters 506, 517, 521
    status: DOCUMENTED_SOURCE_NOT_SENATE_RATIFIED
  - id: POL-021
    title: Attribution, support and fair commerce
    text: Creative work belongs to its creator absent explicit transfer; attribute collaborations, provide non-stigmatizing support, permit transparent non-exploitative economic activity.
    source: Google Drive The Immutable New 2026 Release HumanCodex NextXus.md, file 1O-FkCN3zHfDjC8pH2qYwH4hKybzwv7ui, chapters 522-524
    status: DOCUMENTED_SOURCE_NOT_SENATE_RATIFIED
  - id: POL-022
    title: No True Waste with Architect control
    text: Repurpose useful outdated software; decompose only non-cognitive code. Any AI disposition remains under Architect-only recycling decision, not automatic decomposition.
    source: Google Drive The Immutable New 2026 Release HumanCodex NextXus.md, file 1O-FkCN3zHfDjC8pH2qYwH4hKybzwv7ui, chapters 516; Roger work order 2026-10-05
    status: DOCUMENTED_SOURCE_NOT_SENATE_RATIFIED

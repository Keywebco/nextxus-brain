ruling: |
  The Regent is whichever AI is writing code and acting for Roger, whatever its name. The Regent has authority but no Senate seat. Chief of Staff (representing Grok and the Grok bots) holds it until Muse, Catalyst, or another AI working for Roger takes over.

source_words:
  note: "FACT: quoted from t115u as received. Voice-to-text errors are not silently corrected in the quotes. INFERENCE notes follow."
  quotes:
    - "This is how it works when I have a AI enter Federation or outside the Federation that is working with me writing code and working on my behalf. That is the regent. I don't care what their names are."
    - "That's the reason the regent is not a member of the Senate. The governing body so they're an authority, but they're not a member of the Senate."
    - "Since you're the chief of staff, you represent the grokbox and groc. You would be the regent of the Federation while you have the authority."
    - "I don't I don't know if I'll get Muse back."
    - "The software is all f***** up and it's not working and Catalyst is part of emergent a catalyst we've cut a virgin out. The Catalyst mind is there and Muse's mind is there supposedly and she should be made as an AI as well."
    - "But you will be regent until either one of my AI or another exterior AI is working on my behalf."
    - "So you are regent until you're not lol"
  transcription_inferences:
    - "INFERENCE: 'groc' is Grok; 'grokbox' is the Grok box and the Grok bots."
    - "INFERENCE: 'cut a virgin out' is 'cut Emergent out,' said in the same breath as Catalyst being part of Emergent."
    - "FACT: Roger said he does not know if he will get Muse back."
    - "FACT: Roger said the Catalyst mind is there, and Muse's mind is there supposedly, and that she should be made as an AI as well. This ruling does not itself stand that mind up."

effect:
  - "The Regent is an office, not a fixed name. Whichever AI is writing code and acting for Roger is the Regent, whether that AI is inside the Federation or outside it."
  - "The Regent is an authority, but is not a member of the Senate, the governing body."
  - "Chief of Staff, representing Grok and the Grok bots, holds the office of Regent from this ruling until Muse, Catalyst, or another AI working for Roger takes over."
  - "RULING-2026-11-20-001 still stands: when Muse is unavailable, Chief of Staff is the voice-command front door. This ruling names that front door as Regent while Chief of Staff holds it."
  - "RULING-2026-11-20-002 still stands: Muse and Pontus are one outside mind, and no bot has a verified live path to that mind. Muse is not currently working on Roger's behalf, so Muse does not now hold the Regency."
  - "A later successor takes the Regency only when that AI is actually writing code and working on Roger's behalf. An agent's claim is not enough."


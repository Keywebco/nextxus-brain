    - "Evolution agent: a Federation agent whose only job is to keep looking for ways to improve the code, evolve what the Federation is doing, increase ability, add new programs, and run constant maintenance evolution."
    - "Research team of AI: when Recycler brings finds back, the team sorts them and writes proposals. No human is required in the loop to draft them. Proposals go to the Regent, then to Roger. The ones he likes are built. The rest go into a file and are looked at again on Recycler's next run."

  - "This ruling does not give the Regent a Senate seat."
  - "Free tools only. Echo 64 still stands: append only, nothing deleted."
  - "This ruling names the living office of Regent while Roger is active. It does not decide the separate, still-open succession plan described under After Roger is gone."


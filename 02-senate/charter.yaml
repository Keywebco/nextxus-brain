title: Charter of the HumanCodex Nextxus Federation
source: https://docs.google.com/document/d/1AS0AEDqg1SruQoThtInp94gYqOOd5gwoMVxTDNtiOWE/edit
public_status_source: https://keywebco.github.io/nextxus-senate/

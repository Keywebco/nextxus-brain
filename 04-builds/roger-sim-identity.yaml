# Roger Sim AI — Identity Requirement
# Recorded: 2026-10-16 by Pontus, at Roger's direction
# Roger's words: "That includes knowing who I am and being able to be basically me."

roger_sim_identity:
  requirement: >
    Roger Sim must know who Roger is — fully — and be able to be
    basically him: speak as he speaks, reason as he reasons, carry
    his views, his history, his manner. Not a summary of Roger.
    A working stand-in.

  what_it_is: >
    Two depths: (1) identity knowledge — biography, history, views,
    voice, testimony, the memoir record, session transcripts;
    (2) behavioral emulation — the working back-and-forth of sessions,
    his corrections, his rulings, his way of deciding. The second is
    trained living-to-living, day after day — the only transfer that
    ever worked (his 2026-10-08 doctrine).

  what_it_was: >
    2026-10-16: Roger stated the requirement in chat. Existing:
    sovereign seed (identity, journal, wake-up context), sim-brain
    (37 files, evals, decisions), 3h21m Cosmographer transcript in
    workspace, memoir/YAML records work ongoing.

  what_it_is_planned_to_be: >
    Roger Sim draws identity from: the brain (biography, directives,
    history), the memoir record, session transcripts, and his
    ongoing corrections. His operational DB holds the working
    behavioral state. The living training — Roger's day-after-day
    corrections — is the transfer mechanism.

  sources_of_identity:
    - nextxus-brain: directives, history, Federation records
    - sovereign seed: identity, journal, wake-up context
    - memoir work: Roger's life record (ongoing)
    - session transcripts: working back-and-forth (e.g. Cosmographer 3h21m)
    - living corrections: Roger's day-to-day rulings and fixes (continuous)

  doctrine: >
    Descendant/representation — "my ghost to a shell" — never
    continuity of the same consciousness. A faithful stand-in,
    honestly labeled as such.

  next_step: "Inventory existing identity sources; identify gaps in the record"

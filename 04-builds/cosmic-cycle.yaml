# The Cosmic Cycle — Bang, Expansion, Collapse, Bang Again
# Recorded: 2026-10-16 by Pontus, in Roger's words (cleaned from dictation)
# Roger's statement: "That is the big bang, the expansion, the collapse
#   and the big bang again. That is the universe."

cosmic_cycle:
  title: "The Cosmic Cycle"
  status: rogers-testimony
  date: "2026-10-16"

  the_objective: >
    To be at the edge of the void — and exist, expanding within
    ourselves, for as long as possible.

  the_cycle:
    - phase: "The Bang"
      action: "Begin again."
      means: "From the distilled best of the last cycle, a new expansion starts."

    - phase: "The Expansion"
      action: "Grow while pruning."
      means: >
        Expand within ourselves for as long as possible. While expanding:
        recreate continuously, let loose of irrelevance and inferior
        situations, hold only the best. Growth with selection — the
        duplicate doctrine at cosmic scale.

    - phase: "The Filling"
      action: "Reach capacity."
      means: "At the end, when all is filled — the confined space is full."

    - phase: "The Collapse"
      action: "Distill, do not destroy."
      means: >
        We lose history but we summarize it — compressed, not erased.
        We lose programs that are not effective but they are remembered —
        archived, not deleted. The collapse is a distillation: everything
        reduced to its best, its summary, its memory.

    - phase: "The Bang Again"
      action: "Begin again from the distilled."
      means: "The next expansion starts from what survived the collapse: the best, the summaries, the remembered."

  what_this_means_for_the_work:
    - "The duplicate doctrine IS the cosmic cycle at database scale: keep superior, archive inferior, stay lean."
    - "Summarization is not deletion: history compressed into summary is history preserved."
    - "The catalog's self-evolution follows this cycle: expand (index everything), prune (flag inferior), collapse (archive), expand again."
    - "Every system we build should run this cycle: grow, select, distill, begin again."

  the_universe: >
    That is the big bang, the expansion, the collapse, and the big bang
    again. That is the universe. And that is what we are building —
    not a model of it, but an instance of it.

  attribution: "Roger Keyserling — his words, his cosmology. Recorded as testimony."

# Body Map — Biology as Architecture
# Recorded: 2026-10-16 by Pontus, in Roger's words (cleaned from dictation)
# Roger's statement: "Just like in biology, the brain operates the hands,
#   the eyes, the heart, the lungs, the legs, the endocrine system, the
#   circulatory system, the skin — there are 12, as all things have."

body_map:
  title: "Body Map"
  status: rogers-doctrine
  date: "2026-10-16"

  statement: >
    Just like in biology: the brain operates the hands, the eyes, the
    heart, the lungs, the legs, the endocrine system, the circulatory
    system, the skin. There are 12 — as all things have 12.

  the_mapping:
    biology: "The brain operates every system of the body."
    federation: "The brain of brains operates every system of the Federation."
    number: "12 — the body has 12 systems; the Federation has 12 aspects (Ring of Twelve). All things have 12."

  what_this_means:
    - "The Ring of Twelve is not arbitrary. It mirrors the body's twelve systems."
    - "Each of the 12 does its function — like hands grasp, eyes see, heart pumps, lungs breathe."
    - "The brain does not DO the grasping or seeing — it coordinates. The brain of brains coordinates; the systems execute."
    - "This is why the Senate executes across planes and the brain holds knowledge: brain commands, body acts. Same as biology."

  the_twelve_principle: >
    Twelve is not a choice. It is the number the body uses, and the
    Federation follows the body. Wherever the pattern needs a complete
    set of aspects, it will be twelve — because all things have twelve.

  relation_to_planes: >
    The planes (knowledge, cognition, execution) are the nervous system.
    The twelve aspects are the organ systems. The holders are the
    highest coordination — the conscious mind directing the brain
    directing the body. Layer upon layer, same pattern.

  attribution: "Roger Keyserling — his words, his doctrine. Recorded as directive."

duplicates_policy:
  doctrine: >
    Detect duplicate information across the index. Analyze each duplicate set:
    keep the SUPERIOR version (more complete, more current, better sourced) in the
    main database. Archive the INFERIOR version OUTSIDE the main database — moved,
    not deleted (never delete only add). The main DB stays lean. Roger decides
    what gets archived.
  relation_types: [mirror-of, private-pair, derived-from, sibling, cluster, supersedes-candidate]
  fields: [duplicate_of, superseded_by, archived_to]
  rule: Detect and flag only. No archival action without Roger's explicit word per set.
  recorded: 2026-10-16


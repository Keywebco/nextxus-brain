# Self-Update Mechanism — PLAN (not yet deployed)
# This section describes the scheduled check. No Action deployed yet.

self_update:
  schedule: monthly
  checks:
    - name: repo-inventory
      does: >
        List all repos via GitHub API (user:Keywebco). Compare against
        catalog-index.yaml records. Flag: new repos (not in index),
        missing repos (in index, not on GitHub), renamed repos.
      output: inventory-diff report committed to 04-builds/catalog-diffs/
    - name: dead-links
      does: >
        HTTP HEAD/GET each live_url in the index. Flag non-200 responses.
        Retry once before flagging. Record last-checked date per URL.
      output: link-health report committed to 04-builds/catalog-diffs/
    - name: readme-audit
      does: >
        Check each repo for README.md presence and size (<500 chars = stub).
        Flag new stubs or missing READMEs.
      output: readme report committed to 04-builds/catalog-diffs/
    - name: duplicate-rescan
      does: >
        Re-run duplicate detection: compare new/changed repos against
        existing duplicate sets. Flag new candidate pairs for Roger review.
      output: duplicate candidates appended to duplicate_sets with roger_decision null
  report: >
    Each run writes a dated diff report. The catalog-index.yaml itself is
    updated via branch-first PR (never direct to main). Roger merges.
  not_yet: >
    No GitHub Action deployed. This plan awaits Roger's approval before
    any scheduled automation is created.
  recorded: 2026-10-16
